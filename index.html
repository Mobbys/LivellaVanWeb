<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!--
      La app non fa nessuna chiamata di rete: la policy lo mette per iscritto,
      così un domani un'aggiunta distratta fallisce invece di passare in
      silenzio. blob: serve all'export del backup, data: alle icone inline.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0E12" />
    <meta name="description" content="Livella per camper: inclinazione e centimetri di rialzo per ruota. Funziona offline." />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Livella camper</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
